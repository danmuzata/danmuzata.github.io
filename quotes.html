const quoteBox = document.getElementById("quote-box");
const quoteText = document.getElementById("quote");

let previousIndex = -1;


function fitQuoteToBox() {

  const mobile =
    window.innerWidth <= 600;

  let fontSize =
    mobile ? 24 : 30;

  const minimumSize =
    mobile ? 13 : 17;

  quoteText.style.fontSize =
    fontSize + "px";

  quoteText.style.lineHeight =
    "1.35";

  /*
    Reduce font size only when the selected
    quote does not fit inside the iframe.
  */

  while (
    (
      quoteBox.scrollHeight >
        document.documentElement.clientHeight - 12
      ||
      quoteBox.scrollWidth >
        document.documentElement.clientWidth - 12
    )
    &&
    fontSize > minimumSize
  ) {

    fontSize -= 1;

    quoteText.style.fontSize =
      fontSize + "px";
  }
}


function showNewQuote() {

  quoteBox.style.opacity = 0;

  setTimeout(() => {

    let index;

    do {
      index = Math.floor(Math.random() * quotes.length);
    } while (index === previousIndex);

    previousIndex = index;

    quoteText.textContent = `"${quotes[index]}"`;

    fitQuoteToBox();

    quoteBox.style.opacity = 1;

  }, 1000);
}

showNewQuote();

/* Change quote every 15 seconds */
setInterval(showNewQuote, 15000);


window.addEventListener(
  "resize",
  fitQuoteToBox
);
